version: "3.9"

services:
  # ── Zookeeper (Kafka dependency) ──────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sportvault-net

  # ── Apache Kafka ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sportvault-net

  # ── PostgreSQL – authn_authz database ─────────────────────────────────────
  postgres-authn:
    image: postgres:16-alpine
    container_name: postgres-authn
    environment:
      POSTGRES_USER: authn_user
      POSTGRES_PASSWORD: authn_pass
      POSTGRES_DB: authn_authz
    ports:
      - "5432:5432"
    volumes:
      - postgres-authn-data:/var/lib/postgresql/data
      - ./database/authn_authz/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – account database ─────────────────────────────────────────
  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    environment:
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
      POSTGRES_DB: account
    ports:
      - "5433:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
      - ./database/account/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – admin database ───────────────────────────────────────────
  postgres-admin:
    image: postgres:16-alpine
    container_name: postgres-admin
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
      - ./database/admin/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – shopping_cart database ───────────────────────────────────
  postgres-shopping-cart:
    image: postgres:16-alpine
    container_name: postgres-shopping-cart
    environment:
      POSTGRES_USER: shopping_cart_user
      POSTGRES_PASSWORD: shopping_cart_pass
      POSTGRES_DB: shopping_cart
    ports:
      - "5435:5432"
    volumes:
      - postgres-shopping-cart-data:/var/lib/postgresql/data
      - ./database/shopping_cart/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – order database ───────────────────────────────────────────
  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order
    ports:
      - "5436:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
      - ./database/order/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – inventory database ───────────────────────────────────────
  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory
    ports:
      - "5437:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
      - ./database/inventory/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

  # ── PostgreSQL – seller database ──────────────────────────────────────────
  postgres-seller:
    image: postgres:16-alpine
    container_name: postgres-seller
    environment:
      POSTGRES_USER: seller_user
      POSTGRES_PASSWORD: seller_pass
      POSTGRES_DB: seller
    ports:
      - "5438:5432"
    volumes:
      - postgres-seller-data:/var/lib/postgresql/data
      - ./database/seller/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net

volumes:
  postgres-authn-data:
  postgres-account-data:
  postgres-admin-data:
  postgres-shopping-cart-data:
  postgres-order-data:
  postgres-inventory-data:
  postgres-seller-data:

networks:
  sportvault-net:
    driver: bridge
