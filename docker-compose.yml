version: "3.9"

# ── Reusable healthcheck snippets ─────────────────────────────────────────────
x-postgres-healthcheck: &postgres-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s

x-kafka-healthcheck: &kafka-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 15
    start_period: 30s

services:
  # ── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sportvault-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Apache Kafka ───────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sportvault-net
    <<: *kafka-healthcheck

  # ── Kafka Topic Provisioner ────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b kafka:29092 1 30
      echo 'Creating SportVault topics...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic auth.events            --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.events         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.lookup         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic account.lookup.result  --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic admin.events           --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic product.events         --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.events       --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic shopping_cart.events   --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order.events           --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic seller.events          --partitions 3 --replication-factor 1
      echo 'All topics created successfully.'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - sportvault-net

  # ── PostgreSQL databases ───────────────────────────────────────────────────
  postgres-authn:
    image: postgres:16-alpine
    container_name: postgres-authn
    environment:
      POSTGRES_USER: authn_user
      POSTGRES_PASSWORD: authn_pass
      POSTGRES_DB: authn_authz
    ports:
      - "5432:5432"
    volumes:
      - postgres-authn-data:/var/lib/postgresql/data
      - ./database/authn_authz/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-account:
    image: postgres:16-alpine
    container_name: postgres-account
    environment:
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
      POSTGRES_DB: account
    ports:
      - "5433:5432"
    volumes:
      - postgres-account-data:/var/lib/postgresql/data
      - ./database/account/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-admin:
    image: postgres:16-alpine
    container_name: postgres-admin
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: admin
    ports:
      - "5434:5432"
    volumes:
      - postgres-admin-data:/var/lib/postgresql/data
      - ./database/admin/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-shopping-cart:
    image: postgres:16-alpine
    container_name: postgres-shopping-cart
    environment:
      POSTGRES_USER: shopping_cart_user
      POSTGRES_PASSWORD: shopping_cart_pass
      POSTGRES_DB: shopping_cart
    ports:
      - "5435:5432"
    volumes:
      - postgres-shopping-cart-data:/var/lib/postgresql/data
      - ./database/shopping_cart/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order
    ports:
      - "5436:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
      - ./database/order/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory
    ports:
      - "5437:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
      - ./database/inventory/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  postgres-seller:
    image: postgres:16-alpine
    container_name: postgres-seller
    environment:
      POSTGRES_USER: seller_user
      POSTGRES_PASSWORD: seller_pass
      POSTGRES_DB: seller
    ports:
      - "5438:5432"
    volumes:
      - postgres-seller-data:/var/lib/postgresql/data
      - ./database/seller/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportvault-net
    <<: *postgres-healthcheck

  # ── Microservices ──────────────────────────────────────────────────────────
  authn-authz-service:
    build:
      context: ./services/authn-authz-service
      dockerfile: Dockerfile
    container_name: authn-authz-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres-authn
      DB_PORT: 5432
      DB_NAME: authn_authz
      DB_USER: authn_user
      DB_PASS: authn_pass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: authn-authz-service
      INTERNAL_SECRET: internal-secret
      ACCOUNT_SERVICE_URL: http://account-service:3002
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres-authn:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    container_name: account-service
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: postgres-account
      DB_PORT: 5432
      DB_NAME: account
      DB_USER: account_user
      DB_PASS: account_pass
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: account-service
      INTERNAL_SECRET: internal-secret
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      APP_BASE_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      SEED_PASSWORD: ${SEED_PASSWORD}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-Admin1234!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sportvault.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST: ${ADMIN_FIRST:-Sport}
      ADMIN_LAST: ${ADMIN_LAST:-Vault}
    ports:
      - "3002:3002"
    depends_on:
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: Dockerfile
    container_name: admin-service
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: postgres-admin
      DB_PORT: 5432
      DB_NAME: admin
      DB_USER: admin_user
      DB_PASS: admin_pass
      ACCOUNT_DB_HOST: postgres-account
      ACCOUNT_DB_PORT: 5432
      ACCOUNT_DB_NAME: account
      ACCOUNT_DB_USER: account_user
      ACCOUNT_DB_PASS: account_pass
      INVENTORY_DB_HOST: postgres-inventory
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: inventory
      INVENTORY_DB_USER: inventory_user
      INVENTORY_DB_PASS: inventory_pass
      ORDER_DB_HOST: postgres-order
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: order
      ORDER_DB_USER: order_user
      ORDER_DB_PASS: order_pass
      ORDER_AGE: 60
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: admin-service
      INTERNAL_SECRET: internal-secret
      APP_BASE_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      OUTBOX_POLL_MS: 30000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "3003:3003"
    depends_on:
      postgres-admin:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  shopping-cart-service:
    build:
      context: ./services/shopping-cart-service
      dockerfile: Dockerfile
    container_name: shopping-cart-service
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: postgres-shopping-cart
      DB_PORT: 5432
      DB_NAME: shopping_cart
      DB_USER: shopping_cart_user
      DB_PASS: shopping_cart_pass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: shopping-cart-service
      INTERNAL_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3004:3004"
    depends_on:
      postgres-shopping-cart:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_NAME: order
      DB_USER: order_user
      DB_PASS: order_pass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: order-service
      INTERNAL_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:5173
      ORDER_AGE: 60
      CART_DB_HOST: postgres-shopping-cart
      CART_DB_PORT: 5432
      CART_DB_NAME: shopping_cart
      CART_DB_USER: shopping_cart_user
      CART_DB_PASS: shopping_cart_pass
      INVENTORY_DB_HOST: postgres-inventory
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: inventory
      INVENTORY_DB_USER: inventory_user
      INVENTORY_DB_PASS: inventory_pass
      ADMIN_DB_HOST: postgres-admin
      ADMIN_DB_PORT: 5432
      ADMIN_DB_NAME: admin
      ADMIN_DB_USER: admin_user
      ADMIN_DB_PASS: admin_pass
      ACCOUNT_DB_HOST: postgres-account
      ACCOUNT_DB_PORT: 5432
      ACCOUNT_DB_NAME: account
      ACCOUNT_DB_USER: account_user
      ACCOUNT_DB_PASS: account_pass
      APP_BASE_URL: http://localhost:5173
    ports:
      - "3005:3005"
    depends_on:
      postgres-order:
        condition: service_healthy
      postgres-shopping-cart:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      postgres-admin:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  seller-service:
    build:
      context: ./services/seller-service
      dockerfile: Dockerfile
    container_name: seller-service
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_HOST: postgres-seller
      DB_PORT: 5432
      DB_NAME: seller
      DB_USER: seller_user
      DB_PASS: seller_pass
      ACCOUNT_DB_HOST: postgres-account
      ACCOUNT_DB_PORT: 5432
      ACCOUNT_DB_NAME: account
      ACCOUNT_DB_USER: account_user
      ACCOUNT_DB_PASS: account_pass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: seller-service
      INTERNAL_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3006:3006"
    depends_on:
      postgres-seller:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOST: postgres-inventory
      DB_PORT: 5432
      DB_NAME: inventory
      DB_USER: inventory_user
      DB_PASS: inventory_pass
      ACCOUNT_DB_HOST: postgres-account
      ACCOUNT_DB_PORT: 5432
      ACCOUNT_DB_NAME: account
      ACCOUNT_DB_USER: account_user
      ACCOUNT_DB_PASS: account_pass
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: inventory-service
      INTERNAL_SECRET: internal-secret
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3007:3007"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sportvault-net
    restart: unless-stopped

volumes:
  postgres-authn-data:
  postgres-account-data:
  postgres-admin-data:
  postgres-shopping-cart-data:
  postgres-order-data:
  postgres-inventory-data:
  postgres-seller-data:

networks:
  sportvault-net:
    driver: bridge
