# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:

  ALBDNSName:
    Description: ALB DNS name — create a CNAME record pointing your domain here
    Value: !GetAtt ALB.DNSName

  RDSEndpoint:
    Description: RDS endpoint — connect via bastion to run init.sql files
    Value: !GetAtt RDSInstance.Endpoint.Address

  ECSClusterName:
    Description: ECS cluster name — used in GitHub Actions deploy workflow
    Value: !Ref ECSCluster

  AuthnECRUri:
    Value: !GetAtt AuthnECR.RepositoryUri

