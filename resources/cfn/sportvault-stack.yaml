  # ── IAM Roles ─────────────────────────────────────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sportvault-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JWTSecret
                  - !Ref AuthnDBSecret
                  - !Ref AccountDBSecret
                  - !Ref AdminDBSecret
                  - !Ref CartDBSecret
                  - !Ref OrderDBSecret
                  - !Ref SellerDBSecret
                  - !Ref InventoryDBSecret

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sportvault-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  # ── Task Definitions ──────────────────────────────────────────────────────
  AuthnTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sportvault-authn
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: authn-authz-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sportvault/authn-authz-service:${ImageTag}'
          PortMappings: [{ContainerPort: 3001, Protocol: tcp}]
          Environment:
            - {Name: NODE_ENV,               Value: production}
            - {Name: PORT,                   Value: '3001'}
            - {Name: DB_NAME,                Value: authn_authz}
            - {Name: DB_PORT,                Value: '5432'}
            - {Name: DB_SSL,                  Value: 'true'}
            - {Name: JWT_ACCESS_EXPIRES_IN,  Value: 15m}
            - {Name: JWT_REFRESH_EXPIRES_IN, Value: 7d}
            - {Name: CORS_ORIGIN,            Value: !Ref CorsOrigin}
            - {Name: INTERNAL_SECRET,        Value: internal-secret}
            - {Name: ACCOUNT_SERVICE_URL,    Value: 'http://account-service.sportvault.local:3002'}
            - {Name: KAFKA_BROKERS,       Value: 'kafka.sportvault.local:9092'}
          Secrets:
            - {Name: DB_HOST,            ValueFrom: !Sub '${AuthnDBSecret}:DB_HOST::'}
            - {Name: DB_USER,            ValueFrom: !Sub '${AuthnDBSecret}:DB_USER::'}
            - {Name: DB_PASS,            ValueFrom: !Sub '${AuthnDBSecret}:DB_PASS::'}
            - {Name: JWT_ACCESS_SECRET,  ValueFrom: !Sub '${JWTSecret}:JWT_ACCESS_SECRET::'}
            - {Name: JWT_REFRESH_SECRET, ValueFrom: !Sub '${JWTSecret}:JWT_REFRESH_SECRET::'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /sportvault/authn-authz-service
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Essential: true

